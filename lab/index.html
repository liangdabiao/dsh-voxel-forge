<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体素切片工坊</title>
<script src="scheme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // 字体在 load 后异步注入：CDN 慢/被墙时不阻塞首帧与 load 事件（退化到系统字体）
  addEventListener('load', () => {
    const l = document.createElement('link')
    l.rel = 'stylesheet'
    l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@200..700&family=Noto+Sans+SC:wght@200..700&family=JetBrains+Mono:wght@400;500&display=swap'
    document.head.appendChild(l)
  })
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/">
      <span><span class="brand-name">体素切片工坊</span><span class="brand-sub">dsh-voxel-forge</span></span>
    </a>
    <nav class="nav" aria-label="导航">
      <span class="nav-cap">模型</span>
      <a href="#/">上传 / 模型库</a>
      <span class="nav-cap">配置</span>
      <a href="#/settings">设置</a>
    </nav>
    <div class="rail-foot">
      <span class="badge">VOXEL FORGE</span>
      <span id="rail-version" class="mono muted">v0.1.0</span>
    </div>
  </aside>
  <main id="app" class="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="lightbox" class="lightbox" hidden><img alt=""></div>
<script src="app.js"></script>
</body>
</html>
